name: Support question
description: Ask how to install or run a documented part of the project.
title: '[Support]: '
body:
  - type: markdown
    attributes:
      value: |
        Read SUPPORT.md and README.md first. Phase 2a has a local PostgreSQL inbound-event ledger,
        but no live Telegram, Redis, dashboard, or platform support outside the deliberately narrow
        Telegram Bot and storage scope.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include commands and results with secrets removed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Operating system:
        - Node.js:
        - npm:
        - Commit/version:
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I have not included tokens, cookies, phone numbers, conversation data, or a `.env` file in this issue.
          required: true
