name: Feature request
description: Propose a new capability with a concrete problem and a small scope.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        Phase 0–1a has an official Telegram Bot transport, startup wiring, and synthetic offline tests,
        but no live Telegram or production verification. Read ROADMAP.md first and describe the problem,
        not only the platform you want to add.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who has what problem, in which situation?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest proposal
      description: State the desired behavior, constraints, and relevant data or permissions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include "none" where appropriate.
  - type: checkboxes
    id: policy
    attributes:
      label: Connector boundary
      options:
        - label: I understand that the project prefers official APIs and does not accept CAPTCHA bypasses, fingerprint spoofing, session theft, or spam features.
          required: true
        - label: I have not included tokens, phone numbers, or real conversation data in this proposal.
          required: true
