name: Bug report
description: Report a reproducible defect in the current source code.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping find a defect. Do not paste tokens, cookies, phone numbers,
        conversation content, real payloads, or a `.env` file.
        If this is a vulnerability, stop and follow SECURITY.md instead of opening this issue.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag, commit SHA, or branch in use.
      placeholder: main @ abc1234
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction steps
      description: Use synthetic data sufficient for someone else to reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include logs with secrets removed if useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Operating system:
        - Node.js:
        - npm:
        - How it was run (npm/Docker):
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for duplicates and used synthetic data with no secret or real data.
          required: true
        - label: This is not a security vulnerability report.
          required: true
